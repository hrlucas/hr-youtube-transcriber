<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Transcriber</title>
    <meta name="theme-color" content="#0b1220">
    <style>
        :root {
            --color-brand-primary: #00305b;
            --color-black: #000000;
            --color-white: #FFFFFF;
            --color-bg-web: #f8f9fa;
            --color-border: #dee2e6;
            --color-gray: #6c757d;
            --color-blue: #175098;
            --color-blue-vivid: #0086cd;
            --color-blue-dark: #0a5080;

            --color-text-main: var(--color-brand-primary);
            --color-text-muted: var(--color-gray);
            --color-surface: var(--color-white);
            --color-surface-alt: var(--color-bg-web);
            --color-focus: var(--color-blue-vivid);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;

            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;

            --shadow-card: 0 8px 24px rgba(0, 48, 91, 0.08);
            --shadow-elevated: 0 12px 32px rgba(0, 48, 91, 0.14);

            --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            --font-mono: 'Monaco', 'Menlo', 'Consolas', monospace;
        }

        [data-theme="dark"] {
            --color-brand-primary: #e5edf7;
            --color-black: #000000;
            --color-white: #111827;
            --color-bg-web: #0b1220;
            --color-border: #1f2a44;
            --color-gray: #9aa4b2;
            --color-blue: #1f5fa2;
            --color-blue-vivid: #19a0e6;
            --color-blue-dark: #0f3b5f;
            --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.35);
            --shadow-elevated: 0 14px 36px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--color-bg-web);
            color: var(--color-text-main);
            font-family: var(--font-main);
            font-size: 16px;
            line-height: 1.5;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--space-6);
        }

        .header {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            padding: var(--space-5);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-4);
            margin-bottom: var(--space-6);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: var(--space-4);
        }

        .brand h1 {
            margin: 0;
            font-family: var(--font-main);
            font-size: 32px;
            line-height: 1.2;
            font-weight: 700;
        }

        .brand p {
            margin: 2px 0 0 0;
            font-size: 14px;
            color: var(--color-text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .theme-toggle {
            min-height: 40px;
            padding: 0 14px;
            border: 1px solid var(--color-border);
            border-radius: 999px;
            background: var(--color-surface);
            color: var(--color-text-main);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .theme-toggle:hover {
            border-color: var(--color-blue-vivid);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: var(--space-6);
        }

        .form-column {
            grid-column: span 7;
        }

        .result-column {
            grid-column: span 5;
        }

        .card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card);
            padding: var(--space-6);
        }

        .card h2 {
            margin: 0 0 var(--space-5) 0;
            font-family: var(--font-main);
            font-size: 24px;
            line-height: 1.25;
            font-weight: 700;
            color: var(--color-brand-primary);
        }

        .field-group {
            margin-bottom: var(--space-4);
        }

        .field-group label {
            display: block;
            margin-bottom: var(--space-2);
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text-main);
        }

        .review-option {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text-main);
        }

        .review-option input[type="checkbox"] {
            width: auto;
            min-height: auto;
            margin: 0;
            accent-color: var(--color-blue-vivid);
        }

        .review-hint {
            margin-top: var(--space-1);
            font-size: 12px;
            color: var(--color-text-muted);
        }

        input,
        select,
        textarea,
        button {
            font-family: var(--font-main);
        }

        input,
        select,
        textarea {
            width: 100%;
            min-height: 44px;
            padding: 12px 14px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-white);
            color: var(--color-text-main);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--color-gray);
        }

        input:hover,
        select:hover,
        textarea:hover {
            border-color: var(--color-blue);
        }

        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: none;
            border-color: var(--color-blue-vivid);
            box-shadow: 0 0 0 3px rgba(0, 134, 205, 0.2);
        }

        .url-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .url-row {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: var(--space-2);
        }

        .btn-primary,
        .btn-secondary,
        .btn-ghost {
            min-height: 44px;
            padding: 0 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-primary {
            background: var(--color-brand-primary);
            color: var(--color-white);
            border: 1px solid var(--color-brand-primary);
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--color-blue-dark);
        }

        .btn-primary:active {
            background: var(--color-blue);
        }

        .btn-primary:disabled {
            background: var(--color-border);
            border-color: var(--color-border);
            color: var(--color-gray);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--color-white);
            color: var(--color-brand-primary);
            border: 1px solid var(--color-border);
        }

        .btn-secondary:hover {
            border-color: var(--color-blue);
            background: var(--color-bg-web);
        }

        .btn-ghost {
            background: transparent;
            color: var(--color-blue);
            border: 1px solid transparent;
        }

        .btn-ghost:hover {
            background: rgba(23, 80, 152, 0.08);
        }

        .message {
            border-left: 4px solid var(--color-blue-vivid);
            background: #e8f4fd;
            color: var(--color-blue-dark);
            border-radius: var(--radius-sm);
            padding: var(--space-3);
            margin-bottom: var(--space-4);
            font-size: 14px;
        }

        .message.success {
            border-left-color: #2b8a3e;
            background: #edf7ef;
            color: #1f6b34;
        }

        .message.error {
            border-left-color: #c92a2a;
            background: #fdecec;
            color: #a61b1b;
        }

        [data-theme="dark"] .message {
            background: rgba(25, 160, 230, 0.16);
            color: #d8ecff;
        }

        [data-theme="dark"] .message.success {
            border-left-color: #34d399;
            background: rgba(16, 185, 129, 0.14);
            color: #d1fae5;
        }

        [data-theme="dark"] .message.error {
            border-left-color: #f87171;
            background: rgba(239, 68, 68, 0.14);
            color: #fee2e2;
        }

        .result-list {
            list-style: none;
            margin: 0 0 var(--space-4) 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            max-height: 260px;
            overflow: auto;
        }

        .result-item {
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-white);
            padding: var(--space-3);
        }

        .result-item a {
            color: var(--color-blue);
            font-weight: 600;
            text-decoration: none;
        }

        .result-item a:hover {
            text-decoration: underline;
        }

        #transcribedText {
            min-height: 220px;
            resize: vertical;
            font-family: var(--font-mono);
            font-size: 13px;
        }

        .downloads {
            margin-top: var(--space-2);
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
        }

        .footer {
            margin-top: var(--space-5);
            text-align: center;
            color: var(--color-text-muted);
            font-size: 14px;
        }

        @media (max-width: 1024px) {
            .form-column,
            .result-column {
                grid-column: span 6;
            }
        }

        @media (max-width: 768px) {
            .page {
                padding: var(--space-4);
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-actions {
                width: 100%;
            }

            .grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: var(--space-4);
            }

            .form-column,
            .result-column {
                grid-column: 1 / -1;
            }

            .card {
                padding: var(--space-4);
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="header">
            <div class="brand">
                <div>
                    <h1>YouTube Transcriber</h1>
                    <p>Baixar MP3, MP4 e transcrever vídeo com IA local</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="themeToggle" class="theme-toggle" type="button" aria-label="Alternar tema">
                    <span id="themeToggleText">Modo escuro</span>
                </button>
            </div>
        </header>

        <main class="grid">
            <section class="form-column">
                <article class="card">
                    <h2>Processamento</h2>
                    <form id="processForm">
                        <div class="field-group">
                            <label for="action">O que deseja fazer?</label>
                            <select id="action" name="action">
                                <option value="audio">Baixar como áudio (mp3)</option>
                                <option value="video">Baixar como vídeo (mp4)</option>
                                <option value="transcript">Transcrever com IA local (faster-whisper)</option>
                            </select>
                        </div>

                        <div id="languageGroup" class="field-group" hidden>
                            <label for="language">Idioma da transcrição (opcional)</label>
                            <select id="language" name="language">
                                <option value="">Detectar automaticamente</option>
                                <option value="pt" selected>Português</option>
                                <option value="en">Inglês</option>
                                <option value="es">Espanhol</option>
                                <option value="fr">Francês</option>
                                <option value="de">Alemão</option>
                                <option value="it">Italiano</option>
                                <option value="ja">Japonês</option>
                                <option value="ko">Coreano</option>
                                <option value="zh">Chinês (Mandarim)</option>
                            </select>
                        </div>

                        <div id="reviewGroup" class="field-group" hidden>
                            <label class="review-option" for="reviewText">
                                <input id="reviewText" name="reviewText" type="checkbox" checked>
                                Revisar texto para deixar mais coeso
                            </label>
                            <div class="review-hint">Usa IA local para revisar o texto transcrito</div>
                        </div>

                        <div class="field-group">
                            <label>URLs do YouTube</label>
                            <div id="urlList" class="url-list"></div>
                        </div>

                        <button id="submitButton" class="btn-primary" type="submit">Processar</button>
                    </form>
                </article>
            </section>

            <section class="result-column">
                <article class="card">
                    <h2>Resultado</h2>
                    <div id="statusMessage" class="message">Aguardando ação.</div>
                    <ul id="resultList" class="result-list"></ul>

                    <div id="transcriptResultGroup" class="field-group" hidden>
                        <label for="transcribedText">Transcrição revisada</label>
                        <textarea id="transcribedText" readonly placeholder="A transcrição revisada aparecerá aqui"></textarea>
                        <div id="transcriptDownloads" class="downloads"></div>
                    </div>
                </article>
            </section>
        </main>
    </div>

    <script>
        const actionElement = document.getElementById("action");
        const languageGroupElement = document.getElementById("languageGroup");
        const reviewGroupElement = document.getElementById("reviewGroup");
        const urlListElement = document.getElementById("urlList");
        const submitButtonElement = document.getElementById("submitButton");
        const statusMessageElement = document.getElementById("statusMessage");
        const resultListElement = document.getElementById("resultList");
        const transcriptResultGroupElement = document.getElementById("transcriptResultGroup");
        const transcribedTextElement = document.getElementById("transcribedText");
        const downloadsElement = document.getElementById("transcriptDownloads");
        const themeToggleElement = document.getElementById("themeToggle");
        const themeToggleTextElement = document.getElementById("themeToggleText");
        const metaThemeColorElement = document.querySelector('meta[name="theme-color"]');
        const THEME_STORAGE_KEY = "youtube_transcriber_theme";

        function updateThemeButton(theme) {
            if (!themeToggleTextElement) {
                return;
            }
            themeToggleTextElement.textContent = theme === "dark" ? "Modo claro" : "Modo escuro";
        }

        function applyTheme(theme) {
            const finalTheme = theme === "dark" ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", finalTheme);
            localStorage.setItem(THEME_STORAGE_KEY, finalTheme);
            if (metaThemeColorElement) {
                metaThemeColorElement.setAttribute("content", finalTheme === "dark" ? "#0b1220" : "#f8f9fa");
            }
            updateThemeButton(finalTheme);
        }

        function initTheme() {
            const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
            if (savedTheme === "dark" || savedTheme === "light") {
                applyTheme(savedTheme);
                return;
            }
            const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            applyTheme(prefersDark ? "dark" : "light");
        }

        function updateMessage(text, type = "") {
            statusMessageElement.className = `message ${type}`.trim();
            statusMessageElement.textContent = text;
        }

        function createActionButton(symbol, title, ariaLabel, onClick) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "btn-secondary";
            button.title = title;
            button.setAttribute("aria-label", ariaLabel);
            button.textContent = symbol;
            button.addEventListener("click", onClick);
            return button;
        }

        function createUrlRow(value = "") {
            const row = document.createElement("div");
            row.className = "url-row";

            const input = document.createElement("input");
            input.type = "url";
            input.className = "url-input";
            input.placeholder = "https://www.youtube.com/watch?v=...";
            input.value = value;
            input.required = true;

            const addButton = createActionButton("+", "Adicionar URL", "Adicionar nova URL", () => {
                urlListElement.appendChild(createUrlRow());
            });

            const removeButton = createActionButton("-", "Remover URL", "Remover URL", () => {
                if (urlListElement.children.length === 1) {
                    input.value = "";
                    input.focus();
                    return;
                }
                row.remove();
            });

            row.appendChild(input);
            row.appendChild(addButton);
            row.appendChild(removeButton);
            return row;
        }

        function getUrls() {
            return Array.from(document.querySelectorAll(".url-input"))
                .map((item) => item.value.trim())
                .filter((item) => item.length > 0);
        }

        function clearResults() {
            resultListElement.innerHTML = "";
            transcribedTextElement.value = "";
            downloadsElement.innerHTML = "";
            transcriptResultGroupElement.hidden = true;
        }

        function showResultItem(item) {
            const li = document.createElement("li");
            li.className = "result-item";

            if (item.status === "success") {
                const title = item.title || item.url || "Item processado";
                if (item.file_url && item.file_name) {
                    li.innerHTML = `<strong>Sucesso:</strong> ${title}<br><a href="${item.file_url}">Baixar ${item.file_name}</a>`;
                } else {
                    const method = item.review_method ? `<br><small>Revisão: ${item.review_method}</small>` : "";
                    li.innerHTML = `<strong>Sucesso:</strong> ${title}${method}`;
                }
            } else {
                li.innerHTML = `<strong>Erro:</strong> ${item.url || "URL"}<br>${item.message || "Falha no processamento."}`;
            }

            resultListElement.appendChild(li);
        }

        function showTranscriptDownloads(fileList) {
            downloadsElement.innerHTML = "";
            fileList.forEach((item, index) => {
                if (item.txt_url) {
                    const txtLink = document.createElement("a");
                    txtLink.href = item.txt_url;
                    txtLink.className = "btn-ghost";
                    txtLink.textContent = `Baixar .txt (${index + 1})`;
                    downloadsElement.appendChild(txtLink);
                }
                if (item.md_url) {
                    const mdLink = document.createElement("a");
                    mdLink.href = item.md_url;
                    mdLink.className = "btn-ghost";
                    mdLink.textContent = `Baixar .md (${index + 1})`;
                    downloadsElement.appendChild(mdLink);
                }
            });
        }

        function updateFieldsByAction() {
            const action = actionElement.value;
            const isTranscript = action === "transcript";

            languageGroupElement.hidden = !isTranscript;
            reviewGroupElement.hidden = !isTranscript;
            if (!isTranscript) {
                transcriptResultGroupElement.hidden = true;
            }

            if (action === "audio") {
                submitButtonElement.textContent = "Baixar áudio (mp3)";
            } else if (action === "video") {
                submitButtonElement.textContent = "Baixar vídeo (mp4)";
            } else {
                submitButtonElement.textContent = "Transcrever com IA local";
            }
        }

        async function submitForm(event) {
            event.preventDefault();

            const action = actionElement.value;
            const urls = getUrls();
            const language = document.getElementById("language").value.trim();
            const reviewText = document.getElementById("reviewText").checked;

            if (urls.length === 0) {
                updateMessage("Informe pelo menos uma URL válida.", "error");
                return;
            }

            clearResults();
            submitButtonElement.disabled = true;
            updateMessage("Processando, aguarde...");

            try {
                const response = await fetch("/api/process", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        action,
                        urls,
                        language,
                        review_text: reviewText
                    })
                });

                const data = await response.json().catch(() => ({}));
                const results = Array.isArray(data.results) ? data.results : [];
                results.forEach(showResultItem);

                if (data.transcribed_text) {
                    transcribedTextElement.value = data.transcribed_text;
                    transcriptResultGroupElement.hidden = false;
                }

                if (Array.isArray(data.transcription_files)) {
                    showTranscriptDownloads(data.transcription_files);
                    if (data.transcription_files.length > 0) {
                        transcriptResultGroupElement.hidden = false;
                    }
                }

                if (response.ok && data.status === "success") {
                    updateMessage(data.message || "Concluído com sucesso.", "success");
                } else {
                    updateMessage(data.message || "Processamento falhou.", "error");
                }
            } catch (error) {
                updateMessage("Erro de comunicação com o backend.", "error");
            } finally {
                submitButtonElement.disabled = false;
            }
        }

        urlListElement.appendChild(createUrlRow());
        actionElement.addEventListener("change", updateFieldsByAction);
        document.getElementById("processForm").addEventListener("submit", submitForm);
        if (themeToggleElement) {
            themeToggleElement.addEventListener("click", () => {
                const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
                applyTheme(currentTheme === "dark" ? "light" : "dark");
            });
        }

        initTheme();
        updateFieldsByAction();
    </script>
</body>
</html>
